name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run contracts:check
      - run: pnpm run build
      - run: docker build --build-arg VITE_API_ORIGIN= -t dream-drama-frontend:ci .
