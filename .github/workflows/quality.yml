name: quality

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run contracts:check
      - run: npm run build
      - run: docker build --build-arg VITE_API_ORIGIN= -t dream-drama-frontend:ci .
